[package]
name = "zvezdochka"
version = "0.1.0"
edition = "2024"

[features]

[dependencies]
pulldown-cmark = "0.13.3"
maud = "0.27.0"
urlencoding = "2.1.3"
camino = "1.2.2"
serde_json = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
ammonia = "4.1.2"
seahash = "4.1.0"
base64 = "0.22.1"
rss = "2.0.12"
log = "0.4.29"
env_logger = "0.11.10"
anyhow = "1.0"
lol_html = "2.9.0"
deunicode = "1.6.2"
kakasi = "0.1.0"
snowboard = "0.10.0"
tokio-retry = "0.3.2"
tabular = "0.2.0"
chrono = "0.4"
git2 = "0.21.0"
flume = "0.12.0"
dashmap = "7.0.0-rc2"
octocrab = "0.54.1"
humansize = "2.1.3"
image = "0.25.10"
bandcamp = "0.3.4"

[dependencies.tokio]
version = "1.53.1"
features = ["full"]

[dependencies.url]
version = "2.5.8"
features = ["serde"]

[dependencies.hauchiwa]
version = "0.20.0"
features = ["tokio", "grass", "image", "server", "sitemap", "pagefind", "logging"]

[dependencies.minijinja]
version = "2.19.0"
features = ["unicode", "speedups", "loader"]

[dependencies.minijinja-contrib]
version = "2.19.0"
features = ["pycompat"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.indexmap]
version = "2.14.0"
features = ["serde"]

[dependencies.fancy-duration]
version = "0.9.2"
features = ["serde"]

# Discord Bot Dependencies
[dependencies.poise]
git = "https://github.com/serenity-rs/poise"
branch = "serenity-next"
features = ["cache", "chrono", "handle_panics"]

[dependencies.figment2]
version = "0.11.4"
features = ["toml", "env"]
optional = true

[dependencies.sqlx]
version = "0.8.6"
features = [
    "sqlx-sqlite",
    "sqlite",
    "runtime-tokio",
    "derive",
    "tls-rustls-ring-webpki",
]

[dependencies.process-wrap]
version = "9.1.0"
features = ["tokio1", "std", "kill-on-drop"]
